[package]
name = "pastty"
version = "0.1.0"
edition = "2021"
description = "A minimal native macOS text and image clipboard history"
license = "MIT"
repository = "https://github.com/stormaker/Pastty"
build = "build.rs"

[dependencies]
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
